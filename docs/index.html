<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldLens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{--ink:#2A2418;--gold:#B8860B;--gl:#F3E3B3;--pale:#FBF6E6;--mu:#7A6F58;--line:#E9DFC4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{border-bottom:2px solid var(--gold)}header .w{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:10px;flex-wrap:wrap}
.logo{font:600 1.5rem 'IBM Plex Serif',Georgia,serif}.logo i{font-style:normal;color:var(--gold)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:#fff;color:var(--ink);padding:7px 12px}nav button[aria-current=page]{background:var(--pale);box-shadow:inset 0 -3px var(--gold)}
.me{font-size:.85rem;color:var(--mu)}
h1{font:600 clamp(1.8rem,4.5vw,2.8rem)/1.1 'IBM Plex Serif',Georgia,serif;margin:28px 0 8px;letter-spacing:-.02em}
h2{font:600 1.2rem 'IBM Plex Serif',Georgia,serif;margin:0 0 4px}.lead{max-width:660px;color:#5b5240;margin:0 0 20px}.cap{color:var(--mu);font-size:.84rem;margin:4px 0}
button{font:inherit;background:var(--gold);color:#fff;border:0;padding:9px 18px;cursor:pointer}button:hover{background:#9a700a}nav button:hover{background:var(--pale)}
button.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}input[type=range]{padding:0;border:0;accent-color:var(--gold)}input[type=checkbox]{width:auto}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 3px}
.card{border:1px solid var(--line);padding:22px;max-width:420px;margin:40px auto}.tabs{display:flex;margin:8px 0}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs button[aria-pressed=true]{background:var(--gold);color:#fff;border-color:var(--gold)}
.tm{background:var(--pale);border:1px solid var(--gl);padding:16px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}.tm .d{font:600 1.9rem 'IBM Plex Serif',serif;line-height:1}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:22px 0}.k div{border-top:3px solid var(--gold);padding-top:8px}.k b{font:600 1.6rem 'IBM Plex Serif',serif;display:block}.k span{color:var(--mu);font-size:.85rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:26px 0}@media(max-width:820px){.g2{grid-template-columns:1fr}.tm{grid-template-columns:1fr}}
.v{border-left:5px solid var(--c);background:var(--pale);padding:14px 18px;margin-bottom:10px}.v .t{font:600 1.3rem 'IBM Plex Serif',serif;color:var(--c);margin:0}.v .s{margin:2px 0 0;color:#5b5240;font-size:.92rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}.sc{overflow:auto;max-height:340px}
svg{width:100%;height:auto;display:block}.sl{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:.88rem}
.feed{list-style:none;padding:0;margin:8px 0;max-height:260px;overflow:auto;border-top:1px solid var(--line)}.feed li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.chip{display:inline-block;background:var(--pale);border:1px solid var(--gl);padding:1px 8px;font-size:.75rem;margin-right:8px;color:#5b4300}
.al{border-left:4px solid var(--gold);background:var(--pale);padding:8px 14px;margin:8px 0;font-size:.9rem}.q{border-left-color:var(--line);background:#fff;color:var(--mu)}
.drop{border:2px dashed var(--gold);background:var(--pale);padding:28px;text-align:center}
footer{border-top:1px solid var(--line);margin-top:40px;padding:18px 0 40px;color:var(--mu);font-size:.85rem}
</style></head><body>
<header><div class="w"><div class="logo">Gold<i>Lens</i></div><nav id="nv"></nav><div class="me" id="me"></div></div></header>

function fires(i,z,w){z=z||2;w=w||SY;return w.filter(k=>D.ser[k].z[i]!=null&&Math.abs(D.ser[k].z[i])>z&&Math.abs(D.ser[k].s[i]-D.ser[k].m[i])>hurdle(k)).map(k=>({k,z:D.ser[k].z[i],room:Math.abs(D.ser[k].s[i]-D.ser[k].m[i]),i}))}
const alr=a=>`<div class="al"><b>${a.k}</b> ${a.z>0?"short "+a.k+", long GOLDM":"long "+a.k+", short GOLDM"} · z ${a.z.toFixed(1)} · room ${a.room.toFixed(1)} bps vs cost hurdle ${hurdle(a.k).toFixed(1)}</div>`;
function rd(){const e=equity(),ts=e.ts,n=ts.length,iss=D.issues.filter(r=>r[0]<=D.iso[I]);$("dt").textContent=dl(I);$("sl").value=I;
const fn={};ts.forEach(t=>fn[t[6]]=(fn[t[6]]||0)+net(t));const nf=Object.keys(fn).length,pf=Object.values(fn).filter(v=>v>0).length,nt=ts.reduce((s,t)=>s+net(t),0)*100;
let m,c;if(n<10){m="Too few trades to conclude yet";c="#7A6F58"}else if(nt>0&&pf>=Math.ceil(.6*nf)){m="Edge survives costs on unseen data (tentative)";c="#3E7B4F"}else{m="No robust edge survives costs";c="#A8412F"}
$("vd").innerHTML=`<div class="v" style="--c:${c}"><p class="t">${m}</p><p class="s">${n} trades · ${pf} of ${nf} test windows profitable · net ₹${fmt(nt)} per 100 g after costs</p></div>`;
$("kp").innerHTML=[[I+1,"trading days seen"],[iss.length,"data problems caught"],[n,"trades closed"],["₹"+fmt(ts.reduce((s,t)=>s+t[3]-net(t),0)*100),"costs paid per 100 g"]].map(a=>`<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join("");
const B=D.base[I];let rows="";if(B)[["GOLDM",0],...SY.map(k=>[k,D.ser[k].s[I]])].forEach(([k,g])=>{if(g==null)return;const f=B*(1+g/1e4);rows+=`<tr><td>${k}</td><td>${fmt(quote(f,k))}</td><td>${D.spec[k][0]} g</td><td>${D.spec[k][1]}</td><td>${f.toFixed(1)}</td><td>${g.toFixed(1)}</td></tr>`});
$("cm").innerHTML=`<tr><th>Contract</th><th>Quoted ₹</th><th>Per</th><th>Purity</th><th>₹/g fine</th><th>Gap bps</th></tr>`+(rows||`<tr><td colspan="6">Not enough history yet</td></tr>`);
line($("c1"),D.ser[pick].s,{c:COL[pick],l:"gap chart",ticks:D.trades.filter(t=>t[2]==pick&&t[0]<=I).map(t=>t[0])});line($("c2"),e.y,{c:"#2A2418",zero:1,l:"profit"});
$("al").innerHTML=fires(I).map(alr).join("")||`<div class="al q">Quiet. No real signal on this date, and that is intended.</div>`;
$("fd").innerHTML=iss.slice(-40).reverse().map(r=>`<li><span class="chip">${r[2]}</span><b>${r[0]}</b> ${r[1]} · ${r[3]} → ${r[4]}</li>`).join("")||"<li>Nothing caught yet.</li>"}
/* converter */
function conv(){M.innerHTML=`<h1>Price converter</h1><p class="lead">Type any MCX gold quote. See what the same gold costs in every other contract, and its true price per gram.</p><div class="g2"><div><label for="ck">Contract</label><select id="ck">${Object.keys(D.spec).map(k=>`<option>${k}</option>`).join("")}</select><label for="cp">Quoted price (₹)</label><input id="cp" type="number" value="88500" min="1"><p class="cap" id="cn"></p></div><div id="co"></div></div>`;
const r=()=>{const k=$("ck").value,p=+$("cp").value;if(!(p>0)){$("co").innerHTML="";return}const f=fine(p,k),s=D.spec[k];$("cn").textContent=`That is ₹${p.toLocaleString("en-IN")} per ${s[0]} g of ${s[1]} gold. One lot is ${s[2]} g, worth ₹${fmt(p*s[2]/s[0])}.`;
$("co").innerHTML=`<div class="v" style="--c:#B8860B"><p class="t">₹${f.toFixed(2)} per gram of fine gold</p><p class="s">The pure-gold price behind this quote</p></div><table><tr><th>Equivalent in</th><th>Quote ₹</th><th>Per</th></tr>${Object.keys(D.spec).map(j=>`<tr><td>${j}</td><td>${quote(f,j).toLocaleString("en-IN",{maximumFractionDigits:2})}</td><td>${D.spec[j][0]} g</td></tr>`).join("")}</table><p class="cap">Same gold value at the same moment, ignoring small market gaps.</p>`};
$("ck").onchange=$("cp").oninput=r;r()}
/* trade check */
function trade(){const L=N-1;M.innerHTML=`<h1>Trade check</h1><p class="lead">Before you trade a small contract against GOLDM, see what it will cost and whether today's gap is big enough to pay for it.</p><div class="g2"><div><label for="ts">Contract to trade against GOLDM</label><select id="ts">${SY.map(k=>`<option>${k}</option>`).join("")}</select><label for="tl">Lots</label><input id="tl" type="number" min="1" value="1"><p class="cap">Costs and alert threshold come from your Account and Alerts settings.</p></div><div id="to"></div></div>`;
const r=()=>{const k=$("ts").value,lots=Math.max(1,+$("tl").value||1),g=lots*D.spec[k][2],ntl=g*D.base[L],h=hurdle(k),s=D.ser[k],z=s.z[L],room=s.s[L]==null?null:Math.abs(s.s[L]-s.m[L]),ok=z!=null&&Math.abs(z)>P.z&&room>h;
$("to").innerHTML=`<div class="v" style="--c:${ok?"#3E7B4F":"#7A6F58"}"><p class="t">${ok?"Worth a look":"Not worth it today"}</p><p class="s">${z==null?"Not enough history for "+k:"Gap room "+room.toFixed(1)+" bps vs break-even "+h.toFixed(1)+" bps · z "+z.toFixed(1)}</p></div>`+
kp([[g+" g","gold you are trading"],["₹"+fmt(ntl),"approx. value per leg"],["₹"+fmt(ntl*h/1e4),"round-trip cost (both legs)"],[h.toFixed(1)+" bps","gap needed just to break even"]])+`<p class="cap">GOLDM is 100 g per lot, so matching ${g} g needs ${(g/100).toFixed(2)} GOLDM lots${g<100?" (below 1 lot, so the legs cannot match exactly)":""}.</p>`};
$("ts").onchange=$("tl").oninput=r;r()}
/* upload */
const AL={date:["date","trade date","tradedate"],symbol:["symbol","commodity","instrument name"],expiry:["expiry date","expiry","expirydate"],settle:["settlement price","settle","close","closing price"],vol:["volume(in lots)","volume (in lots)","volume","qty"]};
const col=(o,n)=>{for(const a of AL[n])if(a in o)return o[a];return""};
function upl(){M.innerHTML=`<h1>Check my data</h1><p class="lead">Drop in an MCX Bhavcopy CSV. GoldLens checks it right here in your browser, flags what is wrong and converts every price to ₹ per gram of fine gold. Nothing is uploaded anywhere.</p><div class="drop"><input id="uf" type="file" accept=".csv" aria-label="Choose CSV"><p class="cap">Name the file with its date, for example bhavcopy_2025-06-30.csv, so we can catch a wrong-date file.</p><button class="o" id="sm">Try a sample file with mistakes</button></div><div id="uo"></div>`;
$("uf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>chk(r.result,f.name);r.readAsText(f)};
$("sm").onclick=()=>chk(`Date,Symbol,Expiry Date,Close,Volume\n2025-06-27,GOLDM,2025-08-05,98450,5200\n2025-06-27,GOLDTEN,2025-08-05,98950,900\n2025-06-27,GOLDGUINEA,2025-08-05,78980,310\n2025-06-27,GOLDPETAL,2025-08-05,98700,12\n2025-06-27,GOLDPETAL,2025-09-05,9910,40`,"bhavcopy_2025-06-30.csv")}
function chk(t,name){const L=t.split(/\r?\n/).filter(x=>x.trim()),h=L[0].split(",").map(x=>x.trim().toLowerCase()),rows=L.slice(1).map(l=>{const c=l.split(","),o={};h.forEach((k,i)=>o[k]=(c[i]||"").trim());return o});
const fd=(name.match(/(20\d\d)[-_]?(\d\d)[-_]?(\d\d)/)||[]).slice(1).join("-"),is=[],ok=[];
if(!["date","symbol","expiry","settle"].every(n=>AL[n].some(a=>h.includes(a))))return $("uo").innerHTML=`<div class="al">Could not find the columns we need. Found: ${h.join(", ")}. We need date, symbol, expiry date and a settlement or close price.</div>`;
rows.forEach(o=>{const s=col(o,"symbol").toUpperCase(),p=+col(o,"settle");if(!D.spec[s]||!(p>0))return;ok.push({d:col(o,"date").slice(0,10),s,e:col(o,"expiry").slice(0,10),p,v:+col(o,"vol")||0,f:fine(p,s)})});
const ds=[...new Set(ok.map(r=>r.d))];if(fd&&ds.some(d=>d!=fd))is.push(["WRONG_DATE","file name says "+fd+", rows say "+ds.join(", "),"Do not trust this file for "+fd]);
const by={};ok.forEach(r=>(by[r.e]=by[r.e]||[]).push(r.f));const med=a=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)];
ok.forEach(r=>{const m=med(by[r.e]);r.bad=Math.abs(r.f/m-1)>.05;if(r.bad)is.push(["UNIT_OUTLIER",`${r.s} ${r.e}: ₹${r.f.toFixed(0)}/g vs median ₹${m.toFixed(0)}/g (wrong quote unit?)`,"Excluded"]);if(r.v<50)is.push(["THIN_VOLUME",`${r.s} ${r.e}: only ${r.v} lots`,"Flagged, not tradable depth"])});
const good=ok.filter(r=>!r.bad);$("uo").innerHTML=kp([[ok.length,"rows read"],[is.length,"problems found"],[good.length,"rows clean"]])+(is.length?`<h2>Problems</h2><ul class="feed" style="max-height:none">${is.map(i=>`<li><span class="chip">${i[0]}</span>${i[1]} → ${i[2]}</li>`).join("")}</ul>`:`<div class="al">No problems found.</div>`)+
`<h2>Clean prices on one yardstick</h2><div class="sc"><table><tr><th>Contract</th><th>Expiry</th><th>Quoted ₹</th><th>₹/g fine</th><th>Lots traded</th></tr>${good.map(r=>`<tr><td>${r.s}</td><td>${r.e}</td><td>${r.p.toLocaleString("en-IN")}</td><td>${r.f.toFixed(2)}</td><td>${r.v}</td></tr>`).join("")}</table></div><p><button id="dc">Download clean CSV</button></p>`;
$("dc").onclick=()=>{const b=new Blob(["contract,expiry,quoted,fine_per_gram,lots\n"+good.map(r=>[r.s,r.e,r.p,r.f.toFixed(2),r.v].join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="goldlens_clean.csv";a.click()}}
/* alerts */
function alerts(){M.innerHTML=`<h1>My alerts</h1><p class="lead">Set your rule. GoldLens shows what it says today and how often it would have fired in the past, so you can judge it before you rely on it.</p><div class="g2"><div><h2>Rule</h2><label>Contracts to watch</label><div id="wl"></div><label for="zz">Alert when the gap is this unusual (z): <b id="zv"></b></label><input id="zz" type="range" min="1" max="4" step="0.1" value="${P.z}"><p class="cap">An alert also needs the gap to beat your round-trip cost. Phone and email delivery needs a backend (next step).</p></div><div><h2>Today</h2><div id="at"></div><h2 style="margin-top:20px">History</h2><div id="ah"></div></div></div>`;
const r=()=>{$("zv").textContent=P.z.toFixed(1);$("at").innerHTML=fires(N-1,P.z,P.watch).map(alr).join("")||`<div class="al q">Quiet today.</div>`;const h=[];for(let i=0;i<N;i++)fires(i,P.z,P.watch).forEach(a=>h.push(a));$("ah").innerHTML=`<p><b>${h.length}</b> alerts over ${N} trading days (about ${(h.length/N*21).toFixed(1)} per month).</p><ul class="feed">${h.slice(-12).reverse().map(a=>`<li><span class="chip">${a.k}</span><b>${dl(a.i)}</b> z ${a.z.toFixed(1)} · room ${a.room.toFixed(1)} bps</li>`).join("")}</ul>`};
SY.forEach(k=>{const l=document.createElement("label");l.style.cssText="display:inline-block;margin-right:14px;color:var(--ink)";l.innerHTML=`<input type="checkbox" ${P.watch.includes(k)?"checked":""}> ${k}`;l.firstChild.onchange=e=>{P.watch=e.target.checked?[...P.watch,k]:P.watch.filter(x=>x!=k);save();r()};$("wl").appendChild(l)});
$("zz").oninput=e=>{P.z=+e.target.value;save();r()};r()}
/* account */
function acct(){M.innerHTML=`<h1>Account</h1><div class="g2"><div><label for="an">Name</label><input id="an" value="${U.name}"><label for="ar">I am a</label><select id="ar">${Object.keys(TIP).map(k=>`<option ${k==U.role?"selected":""}>${k}</option>`).join("")}</select><p><button id="sv">Save profile</button> <button class="o" id="so">Sign out</button></p><p class="cap">${U.email=="guest"?"Guest mode: settings stay in this browser.":U.email}</p></div><div><h2>Default trading costs</h2><p class="cap">Your broker's charges, per side, per leg. Used everywhere.</p><div id="cs"></div><p><button class="o" id="rs">Reset to defaults</button></p></div></div>`;
costs($("cs"),()=>{});$("sv").onclick=()=>{U={...U,name:$("an").value||U.name,role:$("ar").value};ls.s("gl_user",U);if(U.email!="guest")ls.s("gl_acct_"+U.email,U);nav()};
$("so").onclick=()=>{ls.d("gl_user");U=null;auth("in")};$("rs").onclick=()=>{P.cost={...D.cost};save();acct()}}
$("me").title=D.source;U?go("Dashboard"):auth("in");
</script></body></html>
